<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 文献综述工作台</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>AI 文献综述工作台</h1>
        <p id="summaryLine">正在读取项目状态...</p>
      </div>
      <div class="top-actions">
        <button id="refreshBtn" class="icon-button" title="刷新状态">↻</button>
        <span id="jobBadge" class="status-badge pending">空闲</span>
      </div>
    </header>

    <main class="layout">
      <section class="workflow-panel">
        <div class="panel-heading">
          <h2>流程</h2>
          <label class="force-toggle"><input id="forceRun" type="checkbox" /> 重新生成</label>
        </div>
        <div id="steps" class="steps"></div>
      </section>

      <section class="workspace">
        <nav class="tabs" aria-label="工作区">
          <button data-tab="editor" class="active">文件编辑</button>
          <button data-tab="overrides">人工介入</button>
          <button data-tab="settings">API 设置</button>
          <button data-tab="logs">运行日志</button>
        </nav>

        <section id="editorTab" class="tab-panel active">
          <div class="editor-toolbar">
            <select id="fileKind">
              <option value="config">配置</option>
              <option value="prompts">Prompts</option>
              <option value="papers">文献 .md</option>
              <option value="cards">文献卡片</option>
              <option value="outputs">全部产出</option>
            </select>
            <select id="fileList"></select>
            <button id="loadFileBtn">打开</button>
            <button id="saveFileBtn">保存</button>
            <button id="deleteFileBtn" class="danger">删除</button>
          </div>
          <div class="upload-row">
            <input id="paperUpload" type="file" accept=".md,text/markdown,text/plain" multiple />
            <button id="uploadBtn">导入文献</button>
            <input id="newPaperName" placeholder="新建文献文件名.md" />
            <button id="createPaperBtn">新建</button>
          </div>
          <div id="currentPath" class="path-line">未打开文件</div>
          <textarea id="fileEditor" spellcheck="false"></textarea>
        </section>

        <section id="overridesTab" class="tab-panel">
          <div class="split-grid">
            <div>
              <h2>核心文献人工覆盖</h2>
              <div class="form-grid">
                <label>文献 ID<select id="overridePaper"></select></label>
                <label>操作<select id="overrideAction">
                  <option value="promote_to_core">标为核心文献</option>
                  <option value="move_to_supporting">标为辅助文献</option>
                  <option value="move_to_peripheral">标为边缘文献</option>
                </select></label>
                <label>理由<input id="overrideReason" placeholder="为什么要这样调整" /></label>
                <label>用途<input id="overrideRoles" value="methodology, findings" /></label>
              </div>
              <button id="addOverrideBtn">加入人工覆盖</button>
              <button id="applyOverrideBtn">保存覆盖并应用</button>
            </div>
            <div>
              <h2>覆盖文件</h2>
              <textarea id="overrideEditor" spellcheck="false"></textarea>
            </div>
          </div>
        </section>

        <section id="settingsTab" class="tab-panel">
          <div class="settings-grid">
            <label>API Key<input id="apiKey" type="password" placeholder="留空则保持现有 key" /></label>
            <label>Base URL<input id="baseUrl" /></label>
            <label>Model<input id="modelName" /></label>
            <label>Temperature<input id="temperature" /></label>
            <label>Timeout 秒<input id="timeout" /></label>
          </div>
          <button id="saveSettingsBtn">保存 API 设置</button>
          <p id="settingsHint" class="muted"></p>
        </section>

        <section id="logsTab" class="tab-panel">
          <pre id="jobLog"></pre>
        </section>
      </section>
    </main>

    <script src="/web/app.js"></script>
  </body>
</html>
