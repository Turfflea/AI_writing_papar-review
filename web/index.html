<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 文献综述工作台</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>AI 文献综述工作台</h1>
        <p id="summaryLine">选择或新建项目后，按步骤完成一次独立综述。</p>
      </div>
      <div class="top-actions">
        <select id="projectSelect" title="选择旧项目"></select>
        <input id="newProjectName" placeholder="新项目名称" />
        <button id="createProjectBtn">新建项目</button>
        <button id="refreshBtn" class="icon-button" title="刷新">↻</button>
        <span id="jobBadge" class="status-badge pending">空闲</span>
      </div>
    </header>

    <main class="layout">
      <aside class="left-panel">
        <section class="setup-panel">
          <div class="panel-heading">
            <h2>项目准备</h2>
            <span id="projectName" class="muted"></span>
          </div>
          <label class="field-label">综述主题和详细介绍</label>
          <textarea id="briefEditor" class="brief-editor" spellcheck="false"></textarea>
          <div class="dimension-box">
            <div class="panel-heading compact-heading">
              <h3>本项目要综合的维度</h3>
              <span class="muted">会影响核心筛选和跨文献综合</span>
            </div>
            <div id="dimensionList" class="dimension-list"></div>
            <button id="saveDimensionsBtn">保存维度</button>
          </div>
          <div class="button-row">
            <button id="saveBriefBtn" class="primary">保存主题</button>
            <button id="settingsToggleBtn">API 设置</button>
          </div>

          <div id="settingsBox" class="settings-box hidden">
            <label>API Key<input id="apiKey" type="password" placeholder="留空则保持现有 key" /></label>
            <label>Base URL<input id="baseUrl" /></label>
            <label>Model<input id="modelName" /></label>
            <label>Temperature<input id="temperature" /></label>
            <label>Timeout 秒<input id="timeout" /></label>
            <button id="saveSettingsBtn">保存 API 设置</button>
            <p id="settingsHint" class="muted"></p>
          </div>

          <div class="paper-import">
            <label class="field-label">导入 Markdown 文献</label>
            <input id="paperUpload" type="file" accept=".md,text/markdown,text/plain" multiple />
            <button id="uploadBtn">导入文献</button>
            <div id="paperList" class="paper-list"></div>
          </div>
        </section>

        <section class="workflow-panel">
          <div class="panel-heading">
            <h2>流程</h2>
            <span class="muted">点击步骤查看说明和模板</span>
          </div>
          <div id="steps" class="steps"></div>
        </section>
      </aside>

      <section class="workspace">
        <section class="step-header">
          <div>
            <h2 id="stepTitle">步骤</h2>
            <p id="stepDescription"></p>
          </div>
          <div class="step-actions">
            <button id="runBtn" class="primary">执行本步</button>
            <button id="rerunBtn" title="覆盖并重新生成本步骤产出">重新生成本步</button>
            <button id="rollbackBtn" class="danger" title="删除本步骤及后续步骤产出">撤回到上一步</button>
            <button id="progressBtn">查看进度</button>
          </div>
        </section>

        <section id="stepOptions" class="options-row"></section>

        <section id="screeningPanel" class="screening-panel hidden">
          <div class="panel-heading">
            <h3>核心文献筛选结果</h3>
            <span class="muted">执行第四步后会在这里按层级展示</span>
          </div>
          <div id="screeningGroups" class="screening-groups"></div>
        </section>

        <section id="promptPanel" class="prompt-panel">
          <div class="prompt-heading">
            <div>
              <h3>提示词和 AI 生成模板</h3>
              <p id="promptHelp" class="muted"></p>
            </div>
            <select id="promptSelect"></select>
          </div>
          <p id="promptDescription" class="template-description"></p>
          <textarea id="promptEditor" spellcheck="false"></textarea>
          <div class="button-row">
            <button id="savePromptBtn">保存模板</button>
          </div>
        </section>

        <section class="output-panel">
          <div class="panel-heading">
            <h3>本步骤产出</h3>
            <span id="outputHint" class="muted"></span>
          </div>
          <div class="output-grid">
            <div id="outputList" class="output-list"></div>
            <div class="output-viewer">
              <div id="currentOutputPath" class="path-line">请选择一个产出文件</div>
              <textarea id="outputEditor" spellcheck="false"></textarea>
              <div class="button-row">
                <button id="saveOutputBtn">保存当前产出</button>
              </div>
            </div>
          </div>
        </section>

        <section class="log-panel">
          <div class="panel-heading">
            <h3>运行日志</h3>
            <span id="jobReturnCode" class="muted"></span>
          </div>
          <pre id="jobLog"></pre>
        </section>
      </section>
    </main>

    <dialog id="progressDialog">
      <div class="dialog-header">
        <h2>单篇文献卡片生成进度</h2>
        <button id="closeProgressBtn">关闭</button>
      </div>
      <p id="progressSummary" class="muted"></p>
      <div id="progressTable" class="progress-table"></div>
    </dialog>

    <script src="/web/app.js"></script>
  </body>
</html>
